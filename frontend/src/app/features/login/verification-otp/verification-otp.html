<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-form-container">
            <div class="back-link-container">
                <a routerLink="/login/forget-password" class="back-link">
                    <mat-icon>arrow_back</mat-icon> Back
                </a>
            </div>

            <div class="form-header">
                <div class="icon-circle">
                    <mat-icon class="header-icon">mark_email_read</mat-icon>
                </div>
                <h1>Check your email</h1>
                <p>We sent a verification code to your email.</p>
            </div>

            <form class="form-content" (submit)="onSubmit($event)">
                <div class="otp-input-container">
                    <mat-form-field appearance="outline" class="form-field otp-field">
                        <mat-label>Verification Code</mat-label>
                        <input matInput type="text" [(ngModel)]="otp" name="otp" required maxlength="6" placeholder="000000">
                    </mat-form-field>
                </div>

                <button mat-flat-button color="primary" class="submit-btn" [disabled]="otp.length < 6 || isLoading">
                    @if (isLoading) {
                        <span>Verifying...</span>
                    } @else {
                        <span>Verify Code</span>
                    }
                </button>
            </form>
            
            <div class="form-footer">
                <p>Didn't receive the code? <a href="javascript:void(0)" class="resend-link">Click to resend</a></p>
            </div>
        </div>
    </div>
</div>
