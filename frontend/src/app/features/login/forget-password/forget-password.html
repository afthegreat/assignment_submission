<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-form-container">
            <div class="back-link-container">
                <a routerLink="/login" class="back-link">
                    <mat-icon>arrow_back</mat-icon> Back to login
                </a>
            </div>

            <div class="form-header">
                <div class="icon-circle">
                    <mat-icon class="header-icon">lock_reset</mat-icon>
                </div>
                <h1>Forgot Password?</h1>
                <p>No worries, we'll send you reset instructions.</p>
            </div>

            <form class="form-content" (submit)="onSubmit($event)">
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Email Address</mat-label>
                    <input matInput type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email">
                    <mat-icon matSuffix class="field-icon">mail</mat-icon>
                </mat-form-field>

                <button mat-flat-button color="primary" class="submit-btn" [disabled]="!email || isLoading">
                    @if (isLoading) {
                        <span>Sending...</span>
                    } @else {
                        <span>Send reset instructions</span>
                    }
                </button>
            </form>
        </div>
    </div>
</div>
